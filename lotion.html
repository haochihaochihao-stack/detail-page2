<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cream</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #fff;
        }

        .detail-page {
            width: 720px;
            margin: 0 auto;
            padding: 0;
            line-height: 0;
            font-size: 0;
        }

        .detail-page img {
            display: block;
            width: 720px;
            height: auto;
            margin: 0;
            padding: 0;
            border: 0;
        }

        /* 모바일에서는 화면 폭에 맞춤 */
        @media (max-width: 720px) {
            .detail-page {
                width: 100%;
            }
            .detail-page img {
                width: 100%;
            }
        }
    </style>
</head>

	
<body>

    <main class="detail-page">
        <img src="images/lotion_000.gif" alt="Cream">

        <img src="images/lotion_1.jpg" alt="Cream">
        <img src="images/lotion_2.gif" alt="Cream">
        <img src="images/lotion_3.jpg" alt="Cream">
        <img src="images/lotion_4.gif" alt="Cream">
        <img src="images/lotion_5.jpg" alt="Cream">

    </main>

</body>
</html>
